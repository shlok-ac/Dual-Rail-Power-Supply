<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Status</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f5f1e8;
            color: #172331;

            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 850px;
            max-width: 90%;
            text-align: center;
        }

        /* Status label */
        .status {
            display: inline-block;

            padding: 10px 18px;

            border: 1px solid #d9d2c5;
            border-radius: 30px;

            background: rgba(255, 255, 255, 0.4);

            color: #64717d;

            font-family: monospace;
            font-size: 13px;
            letter-spacing: 1.5px;
        }

        .status::before {
            content: "●";
            color: #a52d35;
            margin-right: 9px;
        }

        /* Main heading */
        h1 {
            margin: 35px 0 0;

            font-size: clamp(48px, 8vw, 88px);
            line-height: 0.95;

            letter-spacing: -4px;
            font-weight: 800;
        }

        h1 span {
            display: block;
            color: #a52d35;
        }

        /* Description */
        p {
            max-width: 620px;
            margin: 30px auto 0;

            color: #5d7185;

            font-size: 18px;
            line-height: 1.8;
        }

        /* Normal information box */
        .info-box {
            display: inline-block;

            margin-top: 35px;
            padding: 16px 24px;

            border: 1px solid #d9d2c5;
            border-radius: 8px;

            background: #eee9df;

            color: #687482;

            font-family: monospace;
            font-size: 13px;
        }

        /* Small schematic-style line */
        .line {
            width: 100px;
            height: 1px;

            background: #b9b1a3;

            margin: 40px auto 0;
        }

        .reference {
            margin-top: 12px;

            color: #9a968e;

            font-family: monospace;
            font-size: 11px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {

            h1 {
                letter-spacing: -2px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="status">
            PROJECT STATUS
        </div>

        <h1>
            Project Not
            <span>Completed Yet</span>
        </h1>

        <p>
            This project is currently under development.
            The work is still in progress and the final
            documentation will be available once completed.
        </p>

        <div class="info-box">
            STATUS: IN PROGRESS
        </div>

        <div class="line"></div>

        <div class="reference">
            PROJECT · DEVELOPMENT
        </div>

    </main>

</body>
</html>
